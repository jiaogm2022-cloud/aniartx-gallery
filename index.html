<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ANIARTX Gallery</title>
    <link rel="stylesheet" href="css/art-gallery.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="ANIARTX home">
        <span class="brand-mark">ART IP</span>
        <span class="brand-title">Gallery</span>
      </a>
      <div class="toolbar" role="search">
        <label class="search">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Search IP, category, file name" autocomplete="off">
        </label>
        <select id="typeSelect" aria-label="Filter by category">
          <option value="all">All categories</option>
        </select>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-label="IP categories">
        <div class="sidebar-head">
          <p>IP Categories</p>
          <strong id="ipTotal">0</strong>
        </div>
        <nav id="ipNav" class="ip-nav"></nav>
      </aside>

      <section class="content" aria-live="polite">
        <div class="summary">
          <div>
            <p id="eyebrow">All artworks</p>
            <h1 id="pageTitle">ANIARTX Gallery</h1>
          </div>
          <div class="stats">
            <span><strong id="visibleCount">0</strong> shown</span>
            <span><strong id="totalCount">0</strong> total</span>
          </div>
        </div>
        <div id="gallery" class="gallery"></div>
        <p id="emptyState" class="empty-state" hidden>No matching artworks found.</p>
      </section>
    </main>

    <dialog id="viewer" class="viewer">
      <button class="viewer-close" type="button" aria-label="Close">×</button>
      <button class="viewer-nav viewer-prev" type="button" aria-label="Previous artwork">‹</button>
      <figure>
        <img id="viewerImage" alt="">
        <figcaption>
          <strong id="viewerTitle"></strong>
          <span id="viewerMeta"></span>
        </figcaption>
      </figure>
      <button class="viewer-nav viewer-next" type="button" aria-label="Next artwork">›</button>
    </dialog>

    <script src="js/art-gallery.js" defer></script>
  </body>
</html>
