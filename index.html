<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ART IP 画库</title>
    <link rel="stylesheet" href="css/art-gallery.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="ARTIPGLOBAL 首页">
        <span class="brand-mark">ART IP</span>
        <span class="brand-title">画库</span>
      </a>
      <div class="toolbar" role="search">
        <label class="search">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="输入 IP、类型、文件名" autocomplete="off">
        </label>
        <select id="typeSelect" aria-label="按类型筛选">
          <option value="all">全部类型</option>
        </select>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-label="IP 分类">
        <div class="sidebar-head">
          <p>IP 分类</p>
          <strong id="ipTotal">0</strong>
        </div>
        <nav id="ipNav" class="ip-nav"></nav>
      </aside>

      <section class="content" aria-live="polite">
        <div class="summary">
          <div>
            <p id="eyebrow">全部作品</p>
            <h1 id="pageTitle">ART IP 画库</h1>
          </div>
          <div class="stats">
            <span><strong id="visibleCount">0</strong> 件</span>
            <span><strong id="totalCount">0</strong> 总数</span>
          </div>
        </div>
        <div id="gallery" class="gallery"></div>
        <p id="emptyState" class="empty-state" hidden>没有找到匹配的作品。</p>
      </section>
    </main>

    <dialog id="viewer" class="viewer">
      <button class="viewer-close" type="button" aria-label="关闭">×</button>
      <button class="viewer-nav viewer-prev" type="button" aria-label="上一张">‹</button>
      <figure>
        <img id="viewerImage" alt="">
        <figcaption>
          <strong id="viewerTitle"></strong>
          <span id="viewerMeta"></span>
        </figcaption>
      </figure>
      <button class="viewer-nav viewer-next" type="button" aria-label="下一张">›</button>
    </dialog>

    <script src="js/art-gallery.js" defer></script>
  </body>
</html>
